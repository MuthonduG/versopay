<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/verso.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>VersoPaid | M-Pesa Reconciliation & Subscription Management for Kenyan SMEs</title>

    <meta
      name="description"
      content="Automate M-Pesa and bank reconciliation, track subscriptions, detect defaulters, and send payment reminders. Built for Chamas, SACCOs, gyms, and SMEs in Kenya."
    />

    <meta
      name="keywords"
      content="M-Pesa reconciliation Kenya, subscription management Kenya, defaulter tracking Kenya, chama management software, SACCO payment tracking, automated payments Kenya, bank reconciliation Kenya, recurring payments Kenya"
    />

    <meta name="author" content="VersoPaid" />
    <meta name="robots" content="index, follow" />

    <!-- Geo Targeting -->
    <meta name="geo.region" content="KE" />
    <meta name="geo.placename" content="Nairobi, Kenya" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.versopaid.tech/" />
    <link rel="alternate" href="https://www.versopaid.tech/" hreflang="en-ke" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.versopaid.tech/" />
    <meta property="og:title" content="VersoPaid - Automate M-Pesa Reconciliation & Subscriptions" />
    <meta
      property="og:description"
      content="Stop using Excel to track payments. Automate reconciliation, track defaulters, and manage recurring payments in Kenya."
    />
    <meta property="og:image" content="https://www.versopaid.tech/preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VersoPaid - M-Pesa Reconciliation for SMEs" />
    <meta
      name="twitter:description"
      content="Automate payments, track defaulters, and manage subscriptions in Kenya."
    />
    <meta name="twitter:image" content="https://www.versopaid.tech/preview.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (SEO Boost) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VersoPaid",
        "url": "https://www.versopaid.tech/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "M-Pesa reconciliation and subscription tracking platform for Kenyan SMEs",
        "areaServed": {
          "@type": "Country",
          "name": "Kenya"
        },
        "creator": {
          "@type": "Organization",
          "name": "VersoPaid"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
