<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/verso.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>VersoPaid | Personal finance, subscriptions & M-Pesa clarity for Kenya</title>

    <meta
      name="description"
      content="Track subscriptions and recurring charges, categorize spending, set budgets and saving goals, and reconcile M-Pesa and bank activity—in one Kenya-first personal finance app."
    />

    <meta
      name="keywords"
      content="expense tracking Kenya, subscription tracker Kenya, budget app Kenya, saving goals Kenya, M-Pesa reconciliation Kenya, personal finance Kenya, recurring payments Kenya, money app Kenya"
    />

    <meta name="author" content="VersoPaid" />
    <meta name="robots" content="index, follow" />

    <!-- Geo Targeting -->
    <meta name="geo.region" content="KE" />
    <meta name="geo.placename" content="Nairobi, Kenya" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.versopaid.tech/" />
    <link rel="alternate" href="https://www.versopaid.tech/" hreflang="en-ke" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.versopaid.tech/" />
    <meta property="og:title" content="VersoPaid — Track, budget, and plan your money in Kenya" />
    <meta
      property="og:description"
      content="The modern way to manage personal money: recurring visibility, categorized spending, goals, and M-Pesa-ready reconciliation—all in one place."
    />
    <meta property="og:image" content="https://www.versopaid.tech/preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VersoPaid — Personal finance built for Kenya" />
    <meta
      name="twitter:description"
      content="Personal finance clarity meets Kenyan mobile money: recurring visibility, expense tracking, goals, and automated reconciliation."
    />
    <meta name="twitter:image" content="https://www.versopaid.tech/preview.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (SEO Boost) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VersoPaid",
        "url": "https://www.versopaid.tech/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Personal finance app for Kenya: subscriptions, budgeting, goals, and M-Pesa reconciliation",
        "areaServed": {
          "@type": "Country",
          "name": "Kenya"
        },
        "creator": {
          "@type": "Organization",
          "name": "VersoPaid"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
